<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Skills</title>
</head>
<body>
    <h1>Edit Skills</h1>
    <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <textarea name="skills" rows="10" cols="50">{{ existing_skills.skill_name if existing_skills else '' }}</textarea>
        <button type="submit">Update</button>
    </form>
</body>
</html>
